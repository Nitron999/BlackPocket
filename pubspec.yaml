name: black_pocket
description: Stylish custom AI client with Vision, Voice, TTS and History.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_services_binding: ^0.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_markdown: ^0.6.18
  image_picker: ^1.1.0
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
